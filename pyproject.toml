[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seej-plugin-nested"
version = "0.1.0"
description = "Nested structure renderer plugin for seej"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Jiaxi Yang", email = "jason.yang98@foxmail.com"}
]
dependencies = [
    "rich>=10.0.0",
]

[project.entry-points."seej.plugins"]
nested = "seej_plugin_nested:get_renderers"
